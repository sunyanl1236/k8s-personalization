# Strimzi Cluster Operator, installed as an ArgoCD Application (ADR 0004),
# not the direct `helm install` used earlier and then undone.
# ArgoCD will render all chart templates
# https://argo-cd.readthedocs.io/en/stable/user-guide/helm
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  # Where this Application OBJECT lives, not where Strimzi gets installed.
  # ArgoCD's controller only watches Applications in its own namespace by
  # default, same "watches its own namespace" behavior as Strimzi's own
  # Cluster Operator, see spec.destination.namespace below for contrast.
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.1.0
  destination:
    # Which CLUSTER to deploy to, not which namespace. Fixed, special
    # in-cluster DNS name for "this same cluster ArgoCD runs in." One ArgoCD
    # can manage other clusters too; this is how you'd point at one.
    server: https://kubernetes.default.svc
    # Which namespace, on that cluster, Strimzi's operator actually lands
    # in. Independent of metadata.namespace above, different question
    # entirely: that's "where's the instruction," this is "where do the
    # results go."
    namespace: kafka
  syncPolicy:
    automated:
      # selfHeal: false per ADR 0004, same reasoning as root.yaml, needed
      # for the Phase 5 drift-correction drill to be observable.
      selfHeal: false
      prune: true
    syncOptions:
      # Deployment can't be created in a namespace that doesn't exist.
      # Nothing else here creates `kafka`, so without this, sync fails with
      # "namespaces kafka not found." Declarative equivalent of the
      # --create-namespace flag from the earlier direct `helm install`.
      # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options
      - CreateNamespace=true
