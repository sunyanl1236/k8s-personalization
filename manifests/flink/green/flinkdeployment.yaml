apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  # name becomes kubernetes.cluster-id, which Flink stamps on every object it
  # creates for this cluster, including the `app` label on the pods. pdb.yaml
  # selects on that label, so the two files change together.
  name: personalization-green
  namespace: personalization-green
spec:
  image: lab/personalization-pipeline:0.1-0902abb
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_2
  mode: native
  serviceAccount: flink
  # map[string]string, so every number and boolean below is quoted
  flinkConfiguration:
    state.backend.type: rocksdb
    execution.checkpointing.interval: 10s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.incremental: "true"
    execution.checkpointing.num-retained: "3"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    pipeline.generic-types: "false"

    s3.path.style.access: "true"
    # s3.access-key and s3.secret-key are absent on purpose: they arrive as env vars from the minio-credentials Secret
    s3.endpoint: http://minio.minio-tenant.svc.cluster.local

    # One bucket, three disjoint prefixes per side. The rename alone would
    # separate only storageDir, which appends the cluster id; the checkpoint dir
    # appends the JOB id instead, so it needs its own prefix.
    execution.checkpointing.dir: s3://checkpoints/phase-7/green/checkpoints
    high-availability.type: kubernetes
    high-availability.storageDir: s3://checkpoints/phase-7/green/ha #  the JobGraph and pointers. The ConfigMap holds only a pointer to this
    execution.checkpointing.savepoint-dir: s3://checkpoints/phase-7/green/savepoints
    # NATIVE writes RocksDB's own format. CANONICAL, the default, rewrites all
    # state into a backend-independent form and pays that cost twice, once
    # writing the savepoint and once restoring it. Both sides run rocksdb from
    # the same image, so the portability CANONICAL buys is never used.
    kubernetes.operator.savepoint.format.type: NATIVE

    jobmanager.scheduler: Adaptive #  the scheduler can run at reduced parallelism when slots are short, rather than waiting
    taskmanager.numberOfTaskSlots: "2"

    job.autoscaler.enabled: "true"
    job.autoscaler.scaling.enabled: "true"
    job.autoscaler.metrics.window: 3m
    job.autoscaler.stabilization.interval: 1m
    job.autoscaler.target.utilization: "0.6"
    job.autoscaler.catch-up.duration: 5m
    job.autoscaler.vertex.max-parallelism: "6"
    web.adaptive-scheduler.rescale-history.size: "10"
    job.autoscaler.scale-down.interval: 5m # wait 5m before scaling down
    job.autoscaler.scale-down.max-factor: "0.6" # can only decrease no more than 50% parallelism on each vertex each time
    jobmanager.adaptive-scheduler.prefer-minimal-taskmanagers: "true" # pack subtasks onto as few TaskManagers as possible instead of spreading them out

    pipeline.max-parallelism: "120" # divisors 2,3,4,5,6. The default 128 offers only 1,2,4,8
    # ClusterIP because Flink cannot pin a NodePort number. Phase 7 deleted the
    # NodePort Service from both sides: a nodePort is allocated cluster-wide, so
    # blue and green cannot both claim 30011, and giving it to one side only
    # would make that side permanently special. Reach either dashboard with
    #   kubectl port-forward -n personalization-<side> svc/personalization-<side>-rest 8081:8081
    kubernetes.rest-service.exposed.type: ClusterIP

    taskmanager.memory.process.size: 2gb
    taskmanager.memory.network.min: 256mb
    taskmanager.memory.network.max: 256mb
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            # AWS_* are read by Hadoop S3A's EnvironmentVariableCredentialsProvider
            # on the TaskManagers, which never run main()
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            # MINIO_* are read by Env.require at PersonalizationJob.java:191,
            # on the leader JobManager only
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
  jobManager:
    replicas: 2
    resource:
      memory: "2048m"
      cpu: 1
    podTemplate:
      spec:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: personalization
                component: jobmanager
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1
    podTemplate:
      spec:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone # node label in kind-cluster.yaml
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: personalization
                component: taskmanager
  job: # application mode
    jarURI: local:///opt/flink/usrlib/pipeline.jar
    parallelism: 2
    upgradeMode: savepoint
    state: suspended
    args:
      - "--bootstrap-servers=personalization-kafka-bootstrap.kafka.svc.cluster.local:9092"
      - "--debug-prints=false"
      # IDENTICAL on both sides, deliberately. Flink builds transactional ids as
      # <prefix>-<subtask>-<counter>, and the incoming side can only finalise the
      # outgoing side's in-flight transactions by constructing the same ids. A
      # per-side prefix would let two running sides both commit, writing every
      # Recommendation twice in silence; a shared one makes them fence instead.
      # Left at an older phase the sink inherits that run's open transactions and
      # spins its abort loop at 100% CPU without ever converging.
      - "--transactional-id-prefix=personalization-phase-7"