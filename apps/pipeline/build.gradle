plugins {
    id 'java'
    id 'application'
}

group = 'lab.personalization'
version = '0.1'

ext {
    javaVersion = '21'
    flinkVersion = '2.2.0'
    // own version line: <connector>-<flink-minor>
    kafkaConnectorVersion = '5.0.0-2.2'
    log4jVersion = '2.26.1'
    junitVersion = '5.11.4'
    assertjVersion = '3.27.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
    }
}

application {
    mainClass = 'lab.personalization.pipeline.PersonalizationJob'
    applicationDefaultJvmArgs = [
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.time=ALL-UNNAMED',
            // flink-s3-fs-hadoop wraps Hadoop S3A, which uses AWS SDK 1.x, see ADR 0007
            '-Daws.java.v1.disableDeprecationAnnouncement=true'
    ]
}

repositories {
    mavenCentral()
}

configurations {
    // Whatever a real cluster provides at runtime, a test JVM must provide for
    // itself: compileOnly does not reach the test compile classpath on its own.
    testImplementation.extendsFrom compileOnly
}

test {
    useJUnitPlatform()
    // applicationDefaultJvmArgs covers `run`, not `test`. Reused rather than
    // copied so the two lists cannot drift.
    jvmArgs application.applicationDefaultJvmArgs
}

configurations.all {
    // flink-runtime and kafka-clients pull different lz4 modules declaring one capability
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        def maintained = candidates.find { it.id.group == 'at.yawk.lz4' }
        if (maintained != null) {
            select(maintained)
        } else {
            selectHighestVersion()
        }
    }
}

dependencies {
    implementation project(':domain')

    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    runtimeOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"

    compileOnly "org.apache.flink:flink-clients:${flinkVersion}"
    runtimeOnly "org.apache.flink:flink-clients:${flinkVersion}"

    compileOnly "org.apache.flink:flink-statebackend-rocksdb:${flinkVersion}"
    runtimeOnly "org.apache.flink:flink-statebackend-rocksdb:${flinkVersion}"

    // Provided in the image's lib/ and loaded by default, so the job jar must not
    // bundle it. Confirmed in Task 0 from flink:2.2.0 and the docs.
    compileOnly "org.apache.flink:flink-cep:${flinkVersion}"
    runtimeOnly "org.apache.flink:flink-cep:${flinkVersion}"

    implementation "org.apache.flink:flink-connector-kafka:${kafkaConnectorVersion}"

    // discovered at runtime through ServiceLoader, never referenced from Java
    runtimeOnly "org.apache.flink:flink-s3-fs-hadoop:${flinkVersion}"

    // bundled in flink-dist, so not pulled transitively
    compileOnly "org.apache.flink:flink-connector-base:${flinkVersion}"
    runtimeOnly "org.apache.flink:flink-connector-base:${flinkVersion}"

    runtimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    runtimeOnly "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    runtimeOnly "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    // ProcessFunctionTestHarnesses and the *OperatorTestHarness classes live in
    // the tests classifier of flink-runtime; flink-test-utils pulls only the
    // plain artifact, so Task 4's harness tests need this declared.
    testImplementation "org.apache.flink:flink-runtime:${flinkVersion}:tests"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
